<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Autor')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: mobilemenu}"></div>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content"><div class="container-fluid py-4">
    <h1 class="h3 mb-3" th:text="*{id == null} ? 'Cadastrar Autor' : 'Alterar Autor'" th:object="${autor}"></h1>
    <div class="card shadow-sm"><div class="card-body">
        <form th:action="@{/autores/salvar}" th:object="${autor}" method="post">
            <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input class="form-control" type="text" th:field="*{nome}">
            <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Nacionalidade</label>
            <input class="form-control" type="text" th:field="*{nacionalidade}">
            <div class="text-danger small" th:if="${#fields.hasErrors('nacionalidade')}" th:errors="*{nacionalidade}"></div>
        </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Salvar</button>
                <a class="btn btn-secondary" th:href="@{/autores}">Cancelar</a>
            </div>
        </form>
    </div></div>
</div></main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>

<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Multa')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: mobilemenu}"></div><div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content"><div class="container-fluid py-4"><h1 class="h3 mb-3">Alterar Multa</h1><div class="card shadow-sm"><div class="card-body">
<form th:action="@{/multas/salvar}" th:object="${multa}" method="post"><input type="hidden" th:field="*{id}">
<div class="mb-3"><label class="form-label">Dias de atraso</label><input class="form-control" type="number" th:field="*{diasAtraso}"></div>
<div class="mb-3"><label class="form-label">Valor</label><input class="form-control" type="number" step="0.01" th:field="*{valor}"></div>
<div class="mb-3"><label class="form-label">Status</label><select class="form-select" th:field="*{status}"><option value="PENDENTE">PENDENTE</option><option value="PAGA">PAGA</option><option value="CANCELADA">CANCELADA</option></select></div>
<button class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button> <a class="btn btn-secondary" th:href="@{/multas}">Cancelar</a>
</form></div></div></div></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>

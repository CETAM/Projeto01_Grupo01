<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Multas')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: mobilemenu}"></div><div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content"><div class="container-fluid py-4"><h1 class="h3">Controle de Multas</h1><p class="text-secondary">Multas são geradas automaticamente quando uma devolução ocorre após o prazo.</p><div th:replace="~{fragments/layout :: mensagens}"></div>
<div class="card shadow-sm"><div class="card-body table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Aluno</th><th>Livro</th><th>Dias</th><th>Valor</th><th>Status</th><th class="text-end">Ações</th></tr></thead><tbody>
<tr th:each="item:${pagina.content}"><td th:text="${item.emprestimo.aluno.nome}"></td><td th:text="${item.emprestimo.livro.titulo}"></td><td th:text="${item.diasAtraso}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(item.valor,1,2)}"></td><td><span class="badge" th:classappend="${item.status.name() == 'PAGA'} ? 'text-bg-success' : 'text-bg-danger'" th:text="${item.status}"></span></td>
<td class="text-end text-nowrap"><form th:if="${item.status.name() == 'PENDENTE'}" th:action="@{/multas/pagar/{id}(id=${item.id})}" method="post" class="d-inline"><button class="btn btn-sm btn-success"><i class="bi bi-cash"></i> Pagar</button></form><a class="btn btn-sm btn-outline-primary" th:href="@{/multas/editar/{id}(id=${item.id})}"><i class="bi bi-pencil"></i></a><form th:action="@{/multas/excluir/{id}(id=${item.id})}" method="post" class="d-inline"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form></td>
</tr><tr th:if="${pagina.empty}"><td colspan="6" class="text-center text-secondary py-4">Nenhuma multa registrada.</td></tr>
</tbody></table></div></div></div></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>

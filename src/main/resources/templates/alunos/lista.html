<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alunos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: mobilemenu}"></div>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
        <div><h1 class="h3 mb-0">Alunos</h1><small class="text-secondary">Cadastro, consulta, alteração e exclusão.</small></div>
        <a class="btn btn-primary" th:href="@{/alunos/novo}"><i class="bi bi-plus-circle"></i> Novo</a>
    </div>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle">
                <thead><tr><th>ID</th><th>Nome</th><th>Matrícula</th><th>E-mail</th><th class="text-end">Ações</th></tr></thead>
                <tbody>
                <tr th:each="item : ${pagina.content}">
                    <td th:text="${item.id}"></td><td th:text="${item.nome}"></td><td th:text="${item.matricula}"></td><td th:text="${item.email}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/alunos/editar/{id}(id=${item.id})}"><i class="bi bi-pencil"></i></a>
                        <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#modalExcluir"
                                th:attr="data-id=${item.id},data-nome=${item.nome}"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
                <tr th:if="${pagina.empty}"><td colspan="5" class="text-center text-secondary py-4">Nenhum registro cadastrado.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white" th:if="${pagina.totalPages > 1}">
            <nav><ul class="pagination mb-0 justify-content-center">
                <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/alunos(pagina=${pagina.number - 1})}">Anterior</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}" th:classappend="${i == pagina.number} ? 'active'">
                    <a class="page-link" th:text="${i + 1}" th:href="@{/alunos(pagina=${i})}"></a>
                </li>
                <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/alunos(pagina=${pagina.number + 1})}">Próxima</a>
                </li>
            </ul></nav>
        </div>
    </div>
</div>
</main>

<div class="modal fade" id="modalExcluir" tabindex="-1">
<div class="modal-dialog"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title">Confirmar exclusão</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">Deseja realmente excluir <strong id="nomeExcluir"></strong>?</div>
<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
<form id="formExcluir" method="post"><button class="btn btn-danger" type="submit">Excluir</button></form>
</div>
</div></div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
configurarModalExclusao('/alunos/excluir/');
</script>
</body>
</html>

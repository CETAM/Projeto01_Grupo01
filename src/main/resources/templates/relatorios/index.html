<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Relatórios')}"></head><body>
<nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: mobilemenu}"></div><div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content"><div class="container-fluid py-4">
<div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3 mb-0">Relatórios</h1><small class="text-secondary">Resumo gerencial da biblioteca.</small></div><button class="btn btn-outline-primary" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button></div>
<div class="row g-3"><div class="col-md-6 col-xl-4" th:each="item:${resumo}"><div class="card shadow-sm h-100"><div class="card-body"><div class="text-secondary" th:text="${item.key}"></div><div class="display-6 fw-bold" th:text="${item.value}"></div></div></div></div></div>
</div></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
